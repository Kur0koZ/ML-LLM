<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เปรียบเทียบ AI: ไม่ใช้ RAG vs ใช้ RAG</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-4">

  <h1 class="text-center mb-4">เปรียบเทียบ AI: ไม่ใช้ RAG vs ใช้ RAG</h1>

  <div class="input-group input-group-lg mb-4">
    <input id="q" type="text" class="form-control" placeholder="พิมพ์คำถามแล้วกด Enter" autofocus>
    <button id="btn" class="btn btn-primary" onclick="ask()">ถาม</button>
  </div>

  <div class="row g-3">

    <div class="col-md-6">
      <div class="card h-100 border-warning">
        <div class="card-header bg-warning-subtle fw-bold">ไม่ใช้ RAG</div>
        <div class="card-body">
          <div id="plain" class="text-muted">คำตอบจะแสดงที่นี่</div>
        </div>
      </div>
    </div>

    <div class="col-md-6">
      <div class="card h-100 border-success">
        <div class="card-header bg-success-subtle fw-bold">ใช้ RAG</div>
        <div class="card-body">
          <div id="rag" class="text-muted">คำตอบจะแสดงที่นี่</div>

          <div id="ctxbox" class="accordion mt-3 d-none">
            <div class="accordion-item">
              <h2 class="accordion-header">
                <button class="accordion-button collapsed" type="button"
                        data-bs-toggle="collapse" data-bs-target="#ctxcollapse">
                  ข้อมูลอ้างอิง (Context)
                </button>
              </h2>
              <div id="ctxcollapse" class="accordion-collapse collapse">
                <div id="ctx" class="accordion-body"></div>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.getElementById("q").addEventListener("keydown", function (e) {
  if (e.key === "Enter") ask();
});

// ป้องกัน HTML เวลาแสดงผลข้อความ
function esc(text) {
  const div = document.createElement("div");
  div.textContent = text;
  return div.innerHTML.replace(/\n/g, "<br>");
}

function loading(msg) {
  return '<div class="spinner-border spinner-border-sm me-2"></div>' + msg;
}

async function post(mode, question) {
  const r = await fetch("api.php?mode=" + mode, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({question: question})
  });
  return r.json();
}

async function ask() {
  const question = document.getElementById("q").value.trim();
  if (!question) return;

  const btn = document.getElementById("btn");
  const plain = document.getElementById("plain");
  const rag = document.getElementById("rag");
  const ctx = document.getElementById("ctx");
  const ctxbox = document.getElementById("ctxbox");

  btn.disabled = true;
  plain.className = "text-muted";
  rag.className = "text-muted";
  plain.innerHTML = loading("กำลังคิด...");
  rag.innerHTML = loading("กำลังค้นหาเอกสารและคิด...");
  ctxbox.classList.add("d-none");
  ctx.innerHTML = "";

  const p1 = post("plain", question).then(function (d) {
    plain.className = "";
    plain.innerHTML = esc(d.answer);
  });

  const p2 = post("rag", question).then(function (d) {
    rag.className = "";
    rag.innerHTML = esc(d.answer);
    if (d.contexts && d.contexts.length) {
      d.contexts.forEach(function (c, i) {
        ctx.innerHTML += '<div class="alert alert-secondary">' + (i + 1) + ". " + esc(c) + "</div>";
      });
      ctxbox.classList.remove("d-none");
    }
  });

  await Promise.all([p1, p2]);
  btn.disabled = false;
}
</script>
</body>
</html>
